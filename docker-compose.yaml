# Grafana via Docker Compose
# Refs:
#   - https://grafana.com/docs/grafana/latest/setup-grafana/installation/docker/
#   - https://grafana.com/docs/grafana/latest/setup-configure/configure-grafana/
#
# Secrets (GF_SECURITY_ADMIN_USER / GF_SECURITY_ADMIN_PASSWORD) are interpolated
# from the project `.env` file (see `example.env` for a template).
# Compose automatically reads `.env` at the project directory root for variable
# substitution, keeping raw secrets out of this file and out of the container env.

services:
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
      - "--web.enable-lifecycle"
    volumes:
      # Bind mount the local config file (authoritative, version-controlled).
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      # Named volume for the TSDB so metrics survive restarts.
      - prometheus-data:/prometheus
    networks:
      - grafana-net
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --spider http://localhost:9090/-/healthy || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # Credentials are interpolated from `.env` (do NOT commit that file).
      GF_SECURITY_ADMIN_USER: ${grafana-user}
      GF_SECURITY_ADMIN_PASSWORD: ${grafana-password}
      # Disable self-sign-up so anonymous users can't create accounts.
      GF_USERS_ALLOW_SIGN_UP: "false"
      # Pre-provision Prometheus as a datasource so dashboards work out of the box.
      # Grafana can address Prometheus by service name on the shared network.
    volumes:
      # Named volume is the recommended persistence method per Grafana docs.
      - grafana-storage:/var/lib/grafana
    networks:
      - grafana-net
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --spider http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  grafana-storage:
    name: grafana-storage
  prometheus-data:
    name: prometheus-data

networks:
  grafana-net:
    driver: bridge